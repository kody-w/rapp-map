name: spine
# NOT scheduled. The scheduled collector runs in the PRIVATE rapp-tower
# (.github/workflows/spine-collect.yml) because observing 142 private repos
# needs a `repo`-scoped token, and this repository is public — a token here is
# reachable by any workflow anyone can cause to run. Kept for manual runs by
# someone whose own gh token can see the whole estate.
on:
  workflow_dispatch:
  push: {branches: [main], paths: ["tools/spine.py", "spine/overlay.json", "spine/waivers.json"]}

permissions: {contents: write}

jobs:
  vertebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      # The mechanical layer. No repo has to opt in, which is the whole point:
      # the map that died was the one that required someone to go and look.
      # SPINE_TOKEN is a PAT with `repo` scope. Without it, Actions' default
      # GITHUB_TOKEN cannot see other repositories' private repos, and the run
      # produces a perfectly valid map missing every private member. That
      # happened on the first scheduled run: 522 -> 377, green, silent.
      - name: observe the estate
        env: {GH_TOKEN: "${{ secrets.SPINE_TOKEN || secrets.GITHUB_TOKEN }}"}
        run: python3 tools/spine.py collect -o spine/observations.json

      - name: refuse a partial observation
        run: |
          python3 - <<'PY'
          import json, sys
          o = json.load(open("spine/observations.json"))
          v = o.get("visibility", {})
          print(f"observed {o['count']} repos; private visible: "
                f"{v.get('private_visible', 0)}")
          if not v.get("token_sees_private"):
              print("::error::this observation cannot see private repos, so the "
                    "map would be incomplete. Set the SPINE_TOKEN secret to a "
                    "PAT with `repo` scope.")
              sys.exit(1)
          PY

      - name: rebuild the map (derived — never hand-edited)
        run: python3 tools/spine.py map spine/observations.json --overlay spine/overlay.json -o estate-map.json

      - name: canon drift report
        run: python3 tools/spine.py drift spine/observations.json --waivers spine/waivers.json

      # A ratchet, not a wall. Fails only if canon drift got WORSE than the
      # recorded baseline; tightens the baseline automatically when it improves.
      - name: drift gate
        run: python3 tools/spine.py gate spine/observations.json --baseline spine/drift-baseline.json --waivers spine/waivers.json --ratchet

      - name: cut today's vertebra
        run: |
          python3 tools/spine.py snapshot spine/observations.json \
            -o "spine/vertebrae/estate-$(date -u +%F).egg"
          ls -1 spine/vertebrae | tail -3

      - name: commit if anything moved
        run: |
          git config user.name  "spine[bot]"
          git config user.email "spine@users.noreply.github.com"
          git add estate-map.json spine/
          git diff --cached --quiet && { echo "estate unchanged"; exit 0; }
          git commit -m "spine: vertebra $(date -u +%F)

          Derived by tools/spine.py. Do not hand-edit estate-map.json — edit
          spine/overlay.json instead."
          # Two runs can overlap (a schedule and a manual dispatch), and the
          # loser's push is rejected. The observation is still valid, so rebase
          # onto whatever landed and retry rather than throwing the run away.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::could not push after 3 attempts"
          exit 1
